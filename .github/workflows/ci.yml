name: CI

"on":
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cargo: ${{ steps.stage.outputs.cargo }}
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install development tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements.txt
      - name: Validate repository and fixtures
        run: make check-fast PYTHON=python
      - name: Check patch whitespace
        run: git diff --check
      - name: Identify current implementation stage
        id: stage
        run: |
          if test -f Cargo.toml; then
            echo 'cargo=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cargo=false' >> "$GITHUB_OUTPUT"
            echo 'No Cargo workspace exists. Rust application checks have NOT run.' >> "$GITHUB_STEP_SUMMARY"
          fi

  rust-checks:
    name: rust-checks
    needs: repository-checks
    if: needs.repository-checks.outputs.cargo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install and validate development tooling
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements.txt
          python tools/check_repository.py
      - name: Provision declared Rust toolchain and public dependencies
        run: |
          rustup show
          cargo fetch --locked
      - name: Run locked offline Rust checks
        run: make check-rust PYTHON=python
